<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunway Group: Monthly Performance Tracker</title>
<style>
  :root{--ink:#1A2B32;--slate:#4A5E68;--muted:#7C8B93;--line:#E4ECF0;--bg:#F7FAFC;
        --red:#C2383E;--green:#1B8C4E;
        --fb:#1877F2;--ig:#E4405F;--li:#0A66C2;--tt:#111517;--pale:#9AA9B2;--head:#16233A;
        --mag:#C23175;--blue:#60B0E1;--orange:#ED7D31;--page:#F6F7F9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1060px;margin:0 auto;padding:36px 24px 56px}
  h1{font-size:31px;font-weight:800;margin:0;letter-spacing:-.015em;line-height:1.15}
  .sub{color:var(--slate);font-size:14px;margin:0}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{display:block}
  .brand .om{height:18px}
  .brand .sw{height:22px}
  .brand span{width:1px;height:20px;background:var(--line)}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  hr{border:0;border-top:1px solid var(--line);margin:24px 0}
  h2{font-size:15px;font-weight:800;margin:32px 0 4px}
  .hint{color:var(--muted);font-size:13px;margin:0 0 14px}

  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:780px){.row{grid-template-columns:repeat(2,1fr)}}
  .stat{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:20px 20px 18px;box-shadow:0 1px 2px rgba(26,43,50,.05)}
  .stat .accent{position:absolute;top:0;left:0;right:0;height:3px;display:block}
  .stat .p{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
    color:var(--slate);margin-bottom:12px;min-height:18px}
  .stat .v{font-size:33px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .stat .c{font-size:12px;color:var(--muted);margin-top:11px;line-height:1.5}
  .ico{width:17px;height:17px;flex:0 0 17px;display:block}
  .ico.sm{width:15px;height:15px;flex-basis:15px}

  .delta{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:12px}
  .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--pale)}
  .cellwrap{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px}
  .arrow{font-size:9px;line-height:1}

  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;min-width:760px}
  th,td{text-align:center;padding:13px 14px;white-space:nowrap;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}

  /* dark header, the way the report tables read */
  thead th{background:var(--head);color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.01em;
    border-bottom:0;border-left:1px solid rgba(255,255,255,.13);vertical-align:middle}
  thead th:first-child{border-left:0}
  thead tr:first-child th{padding-bottom:6px}
  thead tr:last-child th{padding-top:10px}
  thead th.grp{background:var(--head);color:#8FA3BC;font-size:10.5px;font-weight:700;
    border-bottom:0;padding-bottom:2px}

  /* striped body */
  tbody tr:nth-child(odd) td{background:#fff}
  tbody tr:nth-child(even) td{background:#F7F9FB}
  tbody tr:hover td{background:#EEF4F9}
  tbody tr:last-child td{border-bottom:0}
  td.er{font-weight:800}
  td.plat{font-weight:700;box-shadow:inset 3px 0 0 var(--c)}
  .platname{display:inline-flex;align-items:center;gap:9px}
  tr.sub td{font-size:10.5px;color:var(--muted);font-weight:700;text-align:left;
    padding-top:12px;padding-bottom:10px}
  tr.sub td,tr.sub:hover td{background:#F0F4F8}
  .cellwrap{display:inline-flex;align-items:center;justify-content:center;gap:7px}

  /* first column stays put while the months scroll */
  th:first-child,td:first-child{position:sticky;left:0;z-index:2}
  /* a cell spanning the table cannot stick, its label would scroll out of its own box */
  td[colspan]{position:static}
  thead th:first-child{z-index:3}
  #tblTrend th:first-child,#tblTrend td:first-child{min-width:214px}
  #tblTrend th:nth-child(2),#tblTrend td:nth-child(2){position:sticky;left:214px;z-index:2}
  #tblTrend thead th:nth-child(2){z-index:3}
  #tblTrend td:nth-child(2){box-shadow:1px 0 0 var(--line)}

  /* KPI shading sits above the stripes (needs to out-specify nth-child) */
  tbody tr td.hit{background:#E9F5EC} tbody tr td.miss{background:#FBECEC}
  tbody tr:hover td.hit{background:#DFEFE4} tbody tr:hover td.miss{background:#F7E2E2}
  td.kpi{color:var(--slate);font-weight:700}
  #tblExtra{min-width:820px}
  #tblExtra td:first-child{white-space:normal;min-width:330px;max-width:430px;font-weight:600;
    line-height:1.4;word-break:break-word}

  .tip{border-bottom:1px dotted var(--pale);cursor:help}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
  .tabs button{font:inherit;font-size:13px;font-weight:600;color:var(--slate);background:#fff;
    border:1px solid var(--line);border-radius:999px;padding:6px 15px;cursor:pointer}
  .tabs button:hover{border-color:var(--pale)}
  .tabs button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
  .presets{margin:0 0 14px}
  .presets button[aria-pressed=true]{background:#fff;border-color:var(--ink);color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--ink)}
  .note-scope{color:var(--muted);font-size:12px;margin:-6px 0 20px}
  .flag{font-weight:800;font-size:11.5px;display:inline-flex;align-items:center;gap:4px}
  select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  #tt{position:fixed;z-index:99;max-width:290px;background:var(--ink);color:#fff;font-size:12.5px;
    line-height:1.45;padding:9px 12px;border-radius:8px;box-shadow:0 6px 20px rgba(26,43,50,.28);
    pointer-events:none;opacity:0;transition:opacity .12s;font-weight:400}
  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
</style>
</head>

function deltaPct(now, before){
  if (!before) return "";
  const d = (now - before) / before * 100;
  const cls = d > 0.05 ? "up" : d < -0.05 ? "down" : "flat";
  const ar = d > 0.05 ? "▲" : d < -0.05 ? "▼" : "■";
  return `<span class="delta ${cls}"><span class="arrow">${ar}</span>${Math.abs(d).toFixed(1)}%</span>`;
}
function deltaHTML(now, before){
  if (now === null || before === null || before === undefined) return "";
  const d = now - before;
  const cls = d > 0.005 ? "up" : d < -0.005 ? "down" : "flat";
  const ar = d > 0.005 ? "▲" : d < -0.005 ? "▼" : "■";
  const val = Math.abs(d) < 0.005 ? "level" : Math.abs(d).toFixed(2) + "%";
  return `<span class="delta ${cls}"><span class="arrow">${ar}</span>${val}</span>`;
}

// ---------- follower growth view ----------
function renderFG(){
  ["h4a","p4a","wrapExtra"].forEach(id => document.getElementById(id).hidden = true);
  document.getElementById("h1a").textContent = PERIODS[period].label + ": " + PERIODS[period].range;
  document.getElementById("p1a").textContent = "Followers gained in the month, against the opening base on each platform.";
  document.getElementById("h3a").textContent = "Followers behind each growth rate";

  const gNow = folOf("cur"), gWas = folOf("prev");
  document.getElementById("cards").innerHTML = MAIN.map(([k, label, colour]) => {
    const gained = gNow[k], was = gWas[k], kp = KPI_FG[k];
    const monthly = !!PERIODS[period].month;
    const c = monthly ? fol(PERIODS[period].month, k) : null;
    if (gained === null || gained === undefined) return `<div class="stat"><i class="accent" style="background:${colour}"></i>
      <div class="p">${ICON[k]}${tip(FG_MONTH_TIP["2026-08"], label)}</div>
      <div class="v" style="color:var(--pale)">n/a</div>
      <div class="c">withheld this period</div></div>`;
    const met = gained >= kp.min;
    const split = c && c.split;
    return `<div class="stat"><i class="accent" style="background:${colour}"></i>
      <div class="p">${ICON[k]}${tip(kp.tip, label)}</div>
      <div class="v">+${n(gained)}</div>
      <div class="c">${split ? n(split.organic) + " organic + " + n(split.paid) + " from ads &nbsp;·&nbsp; " : ""}${c && c.count ? n(c.count) + " total &nbsp;·&nbsp; " : ""}${deltaPct(gained, was)} vs ${PERIODS[period].vs}
        &nbsp;·&nbsp; <span class="flag ${met ? "up" : "down"}">${met ? "✓" : "✕"} KPI ${kp.label}</span>
        ${monthly ? "" : tip("A KPI set per month, shown here against a shorter window, so it will read short.", " ⓘ")}</div></div>`;
  }).join("");

  let t = `<thead><tr><th>Platform</th>
    <th>${tip("Follower KPI, as new followers a month. Cells are shaded green where the month met it, red where it fell short.", "KPI")}</th>` +
    DATA.map(r => `<th>${FG_MONTH_TIP[r.month] ? tip(FG_MONTH_TIP[r.month], mShort(r.month)) : mShort(r.month)}</th>`).join("") + `</tr></thead><tbody>`;
  MAIN.forEach(([k, label, colour]) => {
    const kp = KPI_FG[k];
    t += `<tr><td class="plat" style="--c:${colour}"><span class="platname">${ICON[k]}${tip(kp.tip, label)}</span></td>
      <td class="kpi">${kp.label}</td>`;
    DATA.forEach((r, i) => {
      const c = fol(r.month, k), pv = i ? fol(DATA[i-1].month, k) : null;
      if (!c) { t += `<td class="er">n/a</td>`; return; }
      const met = c.gained >= kp.min;
      t += `<td class="er ${met ? "hit" : "miss"}"><span class="cellwrap">+${n(c.gained)}
        <span style="color:var(--muted);font-weight:600">${c.pct.toFixed(2)}%</span></span></td>`;
    });
    t += `</tr>`;
  });
  document.getElementById("tblTrend").innerHTML = t + `</tbody>`;

  function detailFG(){
    const m = DATA[+pick.value].month;
    let h = `<thead><tr><th>Platform</th>
      <th>${tip("Followers gained in the month, before unfollows are netted off. This is the Growth column of the sheet.", "Followers gained")}</th>
      <th>${tip("Total followers at month end. It does not equal last month's total plus the gains, because unfollows are not netted off.", "Total at month end")}</th>
      <th>${tip("Followers gained as a share of the previous month total.", "Growth")}</th>
      <th>KPI</th><th>Against KPI</th></tr></thead><tbody>`;
    MAIN.forEach(([k, label, colour]) => {
      const c = fol(m, k), kp = KPI_FG[k];
      if (!c) { h += `<tr><td class="plat" style="--c:${colour}"><span class="platname">${ICON[k]}${label}</span></td>
        <td colspan="5" style="text-align:right;color:var(--pale)">${tip(FG_MONTH_TIP["2026-08"], "withheld, snapshots unreliable")}</td></tr>`; return; }
      const met = c.gained >= kp.min;
      const gap = n(Math.abs(c.gained - kp.min));
      h += `<tr><td class="plat" style="--c:${colour}"><span class="platname">${ICON[k]}${tip(kp.tip, label)}</span></td>
        <td class="er ${met ? "hit" : "miss"}">${c.split ? tip(n(c.split.organic) + " gained organically and " + n(c.split.paid) + " through follower ads.", "+" + n(c.gained)) : "+" + n(c.gained)}</td><td>${c.count ? n(c.count) : tip(TT_TOTAL_TIP, "&mdash;")}</td>
        <td class="er">${c.pct.toFixed(2)}%</td>
        <td class="kpi">${kp.label}</td>
        <td><span class="flag ${met ? "up" : "down"}">${met ? "✓ +" : "✕ -"}${gap}</span></td></tr>`;
    });
    document.getElementById("tblDetail").innerHTML = h + `</tbody>`;
  }
  pick.onchange = detailFG;
  detailFG();
}

// ---------- website sessions view ----------
function renderGA(){
  document.getElementById("h1a").textContent = PERIODS[period].label + ": " + PERIODS[period].range;
  document.getElementById("p1a").textContent = "Sessions on Sunway Stories, and where they came from.";
  document.getElementById("h3a").textContent = "Sessions by channel";

  const g = gaOf("cur"), pg = gaOf("prev");
  const met = g.visits >= GA_KPI;
  const cards = [
    ["Sessions", n(g.visits), deltaPct(g.visits, pg.visits),
     `<span class="flag ${met ? "up" : "down"}">${met ? "✓" : "✕"} KPI ${n(GA_KPI)}</span>`,
     "var(--blue)", "Total sessions on the site. The KPI is 30,000 visits a month."],
    ["Users", n(g.users), deltaPct(g.users, pg.users), "", "var(--mag)", "People, not visits. A user can return several times in the month."],
    ["Engagement rate", g.engRate.toFixed(2) + "%", deltaHTML(g.engRate, pg.engRate), "", "var(--green)",
     "Share of sessions that lasted over 10 seconds, saw more than one page, or fired a key event. The inverse of bounce rate."],
    ["Avg engagement time", g.avgSec.toFixed(1) + "s", deltaHTML(g.avgSec, pg.avgSec), "", "var(--orange)",
     "Average time a session was actually in focus on the page."]
  ];
  document.getElementById("cards").innerHTML = cards.map(([label, val, delta, flag, colour, desc]) =>
    `<div class="stat"><i class="accent" style="background:${colour}"></i>
      <div class="p">${tip(desc, label)}</div>
      <div class="v">${val}</div>
      <div class="c">${delta} vs ${PERIODS[period].vs}${flag ? " &nbsp;·&nbsp; " + flag : ""}</div></div>`).join("");

  let t = `<thead><tr><th>Channel</th>
    <th>${tip("Only total sessions carry a KPI: 30,000 visits a month. Channels are shown for the mix, not judged against a target.", "KPI")}</th>` +
    DATA.map(r => `<th>${GA_MONTH_TIP[r.month] ? tip(GA_MONTH_TIP[r.month], mShort(r.month)) : mShort(r.month)}</th>`).join("") + `</tr></thead><tbody>`;
  t += `<tr><td class="plat" style="--c:var(--ink)"><span class="platname">${tip("Every session on the site, all channels together.", "All sessions")}</span></td>
    <td class="kpi">${n(GA_KPI)}</td>` +
    DATA.map((r, i) => { const v = GA[r.month].visits, pv = i ? GA[DATA[i-1].month].visits : null;
      return `<td class="er ${v >= GA_KPI ? "hit" : "miss"}"><span class="cellwrap">${n(v)}
        ${pv ? deltaPct(v, pv) : ""}</span></td>`; }).join("") + `</tr>`;
  t += `<tr class="sub"><td colspan="${DATA.length + 2}">${tip("GA4 default channel grouping. Rows do not add exactly to the total: small channels such as Referral, Email, Display and Organic Social are left out.", "By channel")}</td></tr>`;
  GA_ROWS.forEach(([name, colour, desc]) => {
    t += `<tr><td class="plat" style="--c:${colour}"><span class="platname">${tip(desc, name)}</span></td><td class="kpi">&mdash;</td>` +
      DATA.map((r, i) => { const v = GA[r.month].channels[name] || 0, pv = i ? (GA[DATA[i-1].month].channels[name] || 0) : null;
        return `<td class="er"><span class="cellwrap">${v ? n(v) : "&mdash;"}${v && pv ? deltaPct(v, pv) : ""}</span></td>`; }).join("") + `</tr>`;
  });
  document.getElementById("tblTrend").innerHTML = t + `</tbody>`;

  function detailGA(){
    const m = DATA[+pick.value].month, gg = GA[m];
    const us = GA_USERS[m] || {};
    const prevM = PREV_MONTH[m], prevCh = GA[prevM] ? GA[prevM].channels : {};
    const rows = Object.entries(gg.channels).sort((a, b) => b[1] - a[1]);
    let h = `<thead><tr><th>Channel</th>
      <th>${tip("People, not visits. One user can return several times in the month.", "Users")}</th>
      <th>${tip("Sessions from this channel, with the change against last month in brackets.", "Sessions")}</th>
      <th>${tip("Share of the month's total sessions.", "% Sessions")}</th></tr></thead><tbody>`;
    rows.forEach(([name, v]) => {
      const meta = GA_ROWS.find(r => r[0] === name);
      const pv = prevCh[name];
      const d = pv ? (v - pv) / pv * 100 : null;
      const chg = d === null ? "" :
        ` <span class="${d >= 0 ? "up" : "down"}" style="font-weight:700">(${d >= 0 ? "↑" : "↓"}${Math.abs(d).toFixed(2)}%)</span>`;
      h += `<tr><td class="plat" style="--c:${meta ? meta[1] : "var(--line)"}">
        <span class="platname">${meta ? tip(meta[2], name) : name}</span></td>
        <td>${n(us[name] || 0)}</td>
        <td>${n(v)}${chg}</td>
        <td>${(v / gg.visits * 100).toFixed(2)}%</td></tr>`;
    });
    const pu = Object.values(GA_USERS[prevM] || {}).reduce((a, b) => a + b, 0);
    const tu = Object.values(us).reduce((a, b) => a + b, 0);
    const dv = GA[prevM] ? (gg.visits - GA[prevM].visits) / GA[prevM].visits * 100 : null;
    h += `<tr class="sub"><td>All channels</td><td>${n(tu)}</td>
      <td>${n(gg.visits)}${dv === null ? "" : ` <span class="${dv >= 0 ? "up" : "down"}" style="font-weight:700">(${dv >= 0 ? "↑" : "↓"}${Math.abs(dv).toFixed(2)}%)</span>`}</td>
      <td>100.00%</td></tr>`;
    document.getElementById("tblDetail").innerHTML = h + `</tbody>`;
  }
  function landingGA(){
    const m = DATA[+pick.value].month, rows = LP[m] || [];
    document.getElementById("h4a").textContent = "Landing pages";
    document.getElementById("p4a").innerHTML =
      "Where sessions arrived. " + tip("The dashboard API returns only its top 8 or 9 landing pages a month, so these rows do not add up to the month's total sessions.", "Top pages only") + ".";
    let h = `<thead><tr><th>Article</th>
      <th>${tip("Sessions that started on this page, and its share of the month's total.", "Sessions")}</th>
      <th>${tip("Average seconds a session spent engaged on the page. Under about 5 seconds means readers arrived and left.", "Avg. engagement")}</th>
      <th>${tip("Share of sessions that left without engaging.", "Bounce rate")}</th></tr></thead><tbody>`;
    rows.forEach(([path, v, sh, e, b]) => {
      const deep = e >= 30, shallow = e < 5;
      h += `<tr><td>${path}</td>
        <td>${n(v)} <span style="color:var(--muted)">(${sh.toFixed(2)}%)</span></td>
        <td class="${deep ? "hit" : shallow ? "miss" : ""}">${e.toFixed(2)}</td>
        <td class="${b < 60 ? "hit" : b > 85 ? "miss" : ""}">${b.toFixed(2)}%</td></tr>`;
    });
    document.getElementById("tblExtra").innerHTML = h + `</tbody>`;
    ["h4a","p4a","wrapExtra"].forEach(id => document.getElementById(id).hidden = false);
  }
  pick.onchange = () => { detailGA(); landingGA(); };
  detailGA();
  landingGA();
}

// tooltip
const tt = document.getElementById("tt");
document.addEventListener("mouseover", e => {
  const el = e.target.closest("[data-tip]");
  if (!el) return;
  tt.textContent = el.dataset.tip;
  tt.style.opacity = "1";
  const move = ev => {
    const pad = 14, w = Math.min(290, window.innerWidth - 24);
    let x = ev.clientX + pad, y = ev.clientY + pad;
    if (x + w > window.innerWidth - 12) x = window.innerWidth - w - 12;
    if (y + tt.offsetHeight > window.innerHeight - 12) y = ev.clientY - tt.offsetHeight - pad;
    tt.style.left = x + "px"; tt.style.top = y + "px";
  };
  move(e);
  el.addEventListener("mousemove", move);
  el.addEventListener("mouseleave", () => { tt.style.opacity = "0"; el.removeEventListener("mousemove", move); }, {once:true});
});
